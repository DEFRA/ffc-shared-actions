name: Reusable Version and Dependency Audit

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use
        required: false
        type: string
        default: "24"
      target-branch:
        description: Target branch for version bump
        required: false
        type: string
        default: "main"
      audit-level:
        description: npm audit fail threshold (low|moderate|high|critical)
        required: false
        type: string
        default: "moderate"
      run-version-bump:
        description: Run version bump logic
        required: false
        type: boolean
        default: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      audit_exit: ${{ steps.audit.outputs.audit_exit }}
      critical: ${{ steps.audit.outputs.critical }}
      high: ${{ steps.audit.outputs.high }}
      moderate: ${{ steps.audit.outputs.moderate }}
      low: ${{ steps.audit.outputs.low }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run dependency audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level="${{ inputs.audit-level }}" --json > audit.json
          AUDIT_EXIT=$?
          set -e

          echo "audit_exit=$AUDIT_EXIT" >> "$GITHUB_OUTPUT"

          node -e "
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json','utf8'));
          const v = (audit.metadata && audit.metadata.vulnerabilities) || {};
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, 'critical=' + (v.critical || 0) + '\n');
          fs.appendFileSync(out, 'high=' + (v.high || 0) + '\n');
          fs.appendFileSync(out, 'moderate=' + (v.moderate || 0) + '\n');
          fs.appendFileSync(out, 'low=' + (v.low || 0) + '\n');
          "

          echo "Dependency audit threshold: ${{ inputs.audit-level }}"
          node -e "
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json','utf8'));
          const v = (audit.metadata && audit.metadata.vulnerabilities) || {};
          console.log('Vulnerabilities - critical: ' + (v.critical || 0) + ', high: ' + (v.high || 0) + ', moderate: ' + (v.moderate || 0) + ', low: ' + (v.low || 0));
          "

          if [ "$AUDIT_EXIT" -eq 0 ]; then
            echo "Dependency audit passed."
          else
            echo "Dependency audit failed at threshold '${{ inputs.audit-level }}'."
          fi

      - name: Add audit summary
        if: always()
        run: |
          {
            echo "## Dependency Audit";
            echo "";
            echo "- Threshold: ${{ inputs.audit-level }}";
            echo "- Critical: ${{ steps.audit.outputs.critical }}";
            echo "- High: ${{ steps.audit.outputs.high }}";
            echo "- Moderate: ${{ steps.audit.outputs.moderate }}";
            echo "- Low: ${{ steps.audit.outputs.low }}";
            echo "";
            if [ "${{ steps.audit.outputs.audit_exit }}" != "0" ]; then
              echo ":x: Audit failed at threshold '${{ inputs.audit-level }}'.";
            else
              echo ":white_check_mark: Audit passed.";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify PR with audit result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const headRef = '${{ github.head_ref || github.ref_name }}';
            let prNumber = context.payload.pull_request?.number || context.issue.number;

            if (!prNumber) {
              const pullRequests = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });

              prNumber = pullRequests.find((pr) => pr.head?.ref === headRef)?.number;
            }

            if (!prNumber) {
              core.warning('No open pull request found for this branch. Skipping audit comment.');
              return;
            }

            const failed = '${{ steps.audit.outputs.audit_exit }}' !== '0';
            const currentStatus = failed ? 'failed' : 'passed';
            const threshold = '${{ inputs.audit-level }}';
            const critical = '${{ steps.audit.outputs.critical }}';
            const high = '${{ steps.audit.outputs.high }}';
            const moderate = '${{ steps.audit.outputs.moderate }}';
            const low = '${{ steps.audit.outputs.low }}';
            const signature = [currentStatus, threshold, critical, high, moderate, low].join('|');
            const signatureMarker = `<!-- audit-signature:${signature} -->`;
            const commentMarker = '<!-- dependency-audit-comment -->';
            const signaturePrefix = '<!-- audit-signature:';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });

            const managedComments = comments
              .filter((comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                (comment.body.includes(commentMarker) || comment.body.includes(signaturePrefix))
              )
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const primaryComment = managedComments[0];
            const staleComments = managedComments.slice(1);

            if (staleComments.length > 0) {
              await Promise.all(
                staleComments.map((comment) =>
                  github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id
                  })
                )
              );
              core.info(`Removed ${staleComments.length} stale audit comment(s).`);
            }

            const body = [
              failed ? "Dependency audit failed." : "Dependency audit passed.",
              "",
              `Threshold: **${threshold}**`,
              `Critical: **${critical}**`,
              `High: **${high}**`,
              `Moderate: **${moderate}**`,
              `Low: **${low}**`,
              "",
              failed
                ? "Please update vulnerable dependencies before merge."
                : "No vulnerabilities were found at the configured threshold.",
              "",
              `Workflow run: ${runUrl}`,
              "",
              commentMarker,
              signatureMarker
            ].join("\n");

            if (primaryComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: primaryComment.id,
                body
              });
              core.info(`Updated audit comment for signature ${signature}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
              core.info(`Created audit comment for signature ${signature}`);
            }

      - name: Fail pipeline on vulnerable dependencies
        if: steps.audit.outputs.audit_exit != '0'
        run: exit 1

  version-bump:
    name: Version Check and Bump
    needs: dependency-audit
    if: always() && inputs.run-version-bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Determine if version bump is needed
        id: version-check
        run: |
          git fetch origin "${{ inputs.target-branch }}" --depth=1

          MAIN_VERSION=$(git show origin/${{ inputs.target-branch }}:package.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).version))")
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "Version on ${{ inputs.target-branch }}: $MAIN_VERSION"
          echo "Current PR version: $CURRENT_VERSION"

          echo "main_version=$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          NEEDS_BUMP=$(node -e "
            const [cm, cn, cp] = '$CURRENT_VERSION'.split('.').map(Number);
            const [mm, mn, mp] = '$MAIN_VERSION'.split('.').map(Number);
            const ahead = cm > mm || (cm === mm && cn > mn) || (cm === mm && cn === mn && cp > mp);
            console.log(ahead ? 'false' : 'true');
          ")

          echo "needs_bump=$NEEDS_BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        if: steps.version-check.outputs.needs_bump == 'true'
        run: npm version patch --no-git-tag-version

      - name: Commit and push version bump
        if: steps.version-check.outputs.needs_bump == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const headRef = '${{ github.head_ref || github.ref_name }}';

            const { data: refData } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${headRef}`,
            });
            const currentSha = refData.object.sha;

            const { data: commitData } = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: currentSha,
            });

            const packageJson = fs.readFileSync('./package.json', 'utf8');
            const packageLock = fs.readFileSync('./package-lock.json', 'utf8');
            const newVersion = JSON.parse(packageJson).version;

            const [pjBlob, plBlob] = await Promise.all([
              github.rest.git.createBlob({ owner: context.repo.owner, repo: context.repo.repo, content: packageJson, encoding: 'utf-8' }),
              github.rest.git.createBlob({ owner: context.repo.owner, repo: context.repo.repo, content: packageLock, encoding: 'utf-8' }),
            ]);

            const { data: tree } = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: commitData.tree.sha,
              tree: [
                { path: 'package.json', mode: '100644', type: 'blob', sha: pjBlob.data.sha },
                { path: 'package-lock.json', mode: '100644', type: 'blob', sha: plBlob.data.sha },
              ],
            });

            const { data: newCommit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: `chore: bump version to ${newVersion}`,
              tree: tree.sha,
              parents: [currentSha],
            });

            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${headRef}`,
              sha: newCommit.sha,
            });

            core.info(`Successfully bumped version to ${newVersion}`);
